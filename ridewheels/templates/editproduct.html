<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap"
          rel="stylesheet">

    <style>

        body{
            font-family: 'Orbitron', sans-serif;
            background: black;
        }

    </style>

</head>

<body class="min-h-screen flex items-center justify-center p-8">

    <!-- Main Container -->

    <div class="w-full max-w-5xl bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl grid md:grid-cols-2">

        <!-- Left Side Image -->

        <div class="relative hidden md:block">

            <img src="{{ product.image.url }}"
                 class="w-full h-full object-cover">

            <div class="absolute inset-0 bg-black/60 flex flex-col justify-center items-center text-center p-10">

                <h1 class="text-5xl font-black text-red-500 drop-shadow-lg">

                    HOTWHEELS

                </h1>

                <p class="text-gray-200 mt-5 text-lg">

                    Edit your premium HotWheels collection details.

                </p>

            </div>

        </div>

        <!-- Right Side Form -->

        <div class="p-10 md:p-14">

            <h2 class="text-4xl font-bold text-red-500 text-center mb-10">

                Edit Product

            </h2>

            <form method="POST"
                  enctype="multipart/form-data"
                  class="space-y-6">

                {% csrf_token %}

                <!-- Product Name -->

                <div>

                    <label class="text-gray-300 block mb-2">

                        Product Name

                    </label>

                    <input type="text"
                           name="name"
                           value="{{ product.name }}"

                           class="w-full p-4 rounded-xl bg-black border border-zinc-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500">

                </div>

                <!-- Category -->

                <div>

                    <label class="text-gray-300 block mb-2">

                        Category

                    </label>

                    <select name="category"
                            class="w-full p-4 rounded-xl bg-black border border-zinc-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500">

                        <option value="cars"
                            {% if product.category == 'cars' %}selected{% endif %}>
                            Cars
                        </option>

                        <option value="trucks"
                            {% if product.category == 'trucks' %}selected{% endif %}>
                            Trucks
                        </option>

                        <option value="bikes"
                            {% if product.category == 'bikes' %}selected{% endif %}>
                            Bikes
                        </option>

                        <option value="limited"
                            {% if product.category == 'limited' %}selected{% endif %}>
                            Limited Edition
                        </option>

                    </select>

                </div>

                <!-- Price -->

                <div>

                    <label class="text-gray-300 block mb-2">

                        Price

                    </label>

                    <input type="number"
                           name="price"
                           value="{{ product.price }}"

                           class="w-full p-4 rounded-xl bg-black border border-zinc-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500">

                </div>

                <!-- Stock -->

                <div>

                    <label class="text-gray-300 block mb-2">

                        Stock

                    </label>

                    <input type="number"
                           name="stock"
                           value="{{ product.stock }}"

                           class="w-full p-4 rounded-xl bg-black border border-zinc-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500">

                </div>

                <!-- Description -->

                <div>

                    <label class="text-gray-300 block mb-2">

                        Description

                    </label>

                    <textarea name="description"
                              rows="4"

                              class="w-full p-4 rounded-xl bg-black border border-zinc-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500">{{ product.description }}</textarea>

                </div>

                <!-- Current Image -->

                <div>

                    <label class="text-gray-300 block mb-3">

                        Current Product Image

                    </label>

                    <img src="{{ product.image.url }}"
                         class="h-40 rounded-2xl border-2 border-red-500">

                </div>

                <!-- Upload New Image -->

                <div>

                    <label class="text-gray-300 block mb-2">

                        Upload New Image

                    </label>

                    <input type="file"
                           name="image"

                           class="w-full p-4 rounded-xl bg-black border border-zinc-700 text-white">

                </div>

                <!-- Buttons -->

                <div class="flex gap-4 pt-4">

                    <!-- Save Button -->

                    <button type="submit"
                            class="w-full bg-red-600 hover:bg-red-700 transition duration-300 text-white py-4 rounded-xl text-lg font-bold shadow-lg">

                        Save Changes

                    </button>

                    <!-- Back Button -->

                    <a href="{% url 'product_list' %}"
                       class="w-full bg-zinc-700 hover:bg-zinc-800 transition duration-300 text-white py-4 rounded-xl text-lg font-bold text-center">

                        Back

                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
