<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HotWheels Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

    <style>

        body{
            font-family: 'Orbitron', sans-serif;
        }

    </style>

</head>

<body class="bg-black min-h-screen flex items-center justify-center p-6">

    <!-- Main Container -->

    <div class="w-full max-w-5xl bg-zinc-900 rounded-3xl shadow-2xl overflow-hidden grid md:grid-cols-2">

        <!-- Left Side -->

        <div class="relative hidden md:block">

            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop"
                 class="w-full h-full object-cover">

            <div class="absolute inset-0 bg-black/60 flex flex-col justify-center items-center text-center p-10">

                <h1 class="text-5xl font-bold text-red-500 drop-shadow-lg">
                    HOTWHEELS
                </h1>

                <p class="text-gray-200 mt-5 text-lg leading-8">
                    Access your collector dashboard and explore premium HotWheels collections.
                </p>

            </div>

        </div>

        <!-- Right Side -->

        <div class="p-10 md:p-14 flex flex-col justify-center">

            <h2 class="text-4xl font-bold text-red-500 text-center mb-3">
                Login Account
            </h2>

            <p class="text-gray-400 text-center mb-10">
                Welcome back to HotWheels Store
            </p>

            <!-- Error Message -->

            {% if error %}

                <div class="bg-red-600 text-white p-4 rounded-xl mb-6 text-center">

                    {{ error }}

                </div>

            {% endif %}

            <!-- Login Form -->

            <form method="POST" class="space-y-6">

                {% csrf_token %}

                <!-- Email -->

                <div>

                    <label class="text-gray-300 block mb-2">
                        Email Address
                    </label>

                    <input type="email"
                           name="email"
                           placeholder="Enter your email"
                           required

                           class="w-full p-4 rounded-xl bg-zinc-800 border border-zinc-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500">

                </div>

                <!-- Password -->

                <div>

                    <label class="text-gray-300 block mb-2">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           placeholder="Enter your password"
                           required

                           class="w-full p-4 rounded-xl bg-zinc-800 border border-zinc-700 text-white focus:outline-none focus:ring-2 focus:ring-red-500">

                </div>

                <!-- Remember + Forgot -->

                <div class="flex items-center justify-between text-sm">

                    <label class="flex items-center text-gray-400">

                        <input type="checkbox" class="mr-2">

                        Remember Me

                    </label>

                    <a href="#"
                       class="text-red-500 hover:underline">

                        Forgot Password?

                    </a>

                </div>

                <!-- Button -->

                <button type="submit"
                        class="w-full bg-red-600 hover:bg-red-700 transition duration-300 text-white py-4 rounded-xl text-lg font-bold shadow-lg">

                    LOGIN NOW

                </button>

            </form>

            <!-- Register Link -->

            <p class="text-gray-400 text-center mt-8">

                Don't have an account?

                <a href="{% url 'register' %}"
                   class="text-red-500 hover:underline">

                    Register

                </a>

            </p>

        </div>

    </div>

</body>

</html>
