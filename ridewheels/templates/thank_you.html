<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Hot Wheels Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            overflow:hidden;
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#050816,#0d1b2a,#1b263b);
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
        }

        /* Animated background glow */
        body::before{
            content:'';
            position:absolute;
            width:600px;
            height:600px;
            background:radial-gradient(circle,rgba(255,0,0,0.35),transparent 70%);
            top:-150px;
            left:-150px;
            animation:moveGlow 6s infinite alternate;
        }

        body::after{
            content:'';
            position:absolute;
            width:500px;
            height:500px;
            background:radial-gradient(circle,rgba(0,140,255,0.3),transparent 70%);
            bottom:-150px;
            right:-150px;
            animation:moveGlow2 7s infinite alternate;
        }

        @keyframes moveGlow{
            from{transform:translate(0,0);}
            to{transform:translate(80px,60px);}
        }

        @keyframes moveGlow2{
            from{transform:translate(0,0);}
            to{transform:translate(-60px,-80px);}
        }

        .thankyou-box{
            width:90%;
            max-width:700px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:25px;
            padding:50px 40px;
            text-align:center;
            color:white;
            box-shadow:0 0 40px rgba(0,0,0,0.5);
            position:relative;
            z-index:10;
            animation:fadeIn 1.2s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .success-icon{
            width:120px;
            height:120px;
            background:linear-gradient(135deg,#ff0000,#ff7300);
            margin:auto;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:60px;
            box-shadow:0 0 25px rgba(255,0,0,0.7);
            animation:pulse 2s infinite;
        }

        @keyframes pulse{
            0%{
                transform:scale(1);
                box-shadow:0 0 20px rgba(255,0,0,0.6);
            }
            50%{
                transform:scale(1.08);
                box-shadow:0 0 40px rgba(255,80,0,1);
            }
            100%{
                transform:scale(1);
                box-shadow:0 0 20px rgba(255,0,0,0.6);
            }
        }

        h1{
            margin-top:25px;
            font-size:52px;
            font-family:'Orbitron',sans-serif;
            color:#ff4d4d;
            text-shadow:0 0 15px rgba(255,0,0,0.8);
        }

        .message{
            margin-top:20px;
            font-size:20px;
            line-height:1.8;
            color:#dbe9ff;
        }

        .highlight{
            color:#00c3ff;
            font-weight:600;
        }

        .buttons{
            margin-top:40px;
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            padding:15px 35px;
            border-radius:50px;
            font-size:17px;
            font-weight:600;
            transition:0.4s;
            position:relative;
            overflow:hidden;
        }

        .home-btn{
            background:linear-gradient(135deg,#ff0000,#ff7300);
            color:white;
            box-shadow:0 0 20px rgba(255,80,0,0.6);
        }

        .home-btn:hover{
            transform:translateY(-5px) scale(1.05);
            box-shadow:0 0 35px rgba(255,80,0,1);
        }

        .shop-btn{
            background:transparent;
            border:2px solid #00c3ff;
            color:#00c3ff;
        }

        .shop-btn:hover{
            background:#00c3ff;
            color:#08111f;
            transform:translateY(-5px);
            box-shadow:0 0 30px rgba(0,195,255,0.8);
        }

        .car{
            position:absolute;
            bottom:30px;
            left:-250px;
            width:220px;
            animation:drive 7s linear infinite;
            z-index:1;
        }

        @keyframes drive{
            0%{
                left:-250px;
            }
            100%{
                left:120%;
            }
        }

        @media(max-width:768px){

            h1{
                font-size:36px;
            }

            .message{
                font-size:17px;
            }

            .thankyou-box{
                padding:35px 25px;
            }

            .success-icon{
                width:90px;
                height:90px;
                font-size:45px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Hot Wheels Car -->
    <img src="https://cdn.freebiesupply.com/logos/large/2x/hot-wheels-4-logo-png-transparent.png" class="car" alt="Hot Wheels Car">

    <div class="thankyou-box">

        <div class="success-icon">
            ✓
        </div>

        <h1>THANK YOU!</h1>

        <p class="message">
            Your feedback has been successfully submitted to the
            <span class="highlight">Hot Wheels Store</span>.
            <br><br>
            Your opinion helps us create a faster, cooler, and more exciting experience for every collector and racer!
        </p>

        <div class="buttons">
            <a href="/" class="btn home-btn">🏠 Back to Home</a>

            <a href="/products/" class="btn shop-btn">
                🛒 Continue Shopping
            </a>
        </div>

    </div>

</body>
</html>
