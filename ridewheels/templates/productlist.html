<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>HotWheels Products</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-black text-white min-h-screen p-10">

    <div class="flex justify-between items-center mb-10">

        <h1 class="text-5xl font-bold text-red-500">
            HOTWHEELS PRODUCTS
        </h1>

        <a href="{% url 'add_product' %}"
           class="bg-red-600 px-6 py-3 rounded-xl hover:bg-red-700">

            Add Product

        </a>

    </div>

    <div class="grid md:grid-cols-3 gap-8">

        {% for product in products %}

        <div class="bg-zinc-900 rounded-3xl overflow-hidden shadow-lg">

            <img src="{{ product.image.url }}"
                 class="h-64 w-full object-cover">

            <div class="p-6">

                <h2 class="text-3xl font-bold text-red-500">
                    {{ product.name }}
                </h2>

                <p class="mt-3 text-gray-300">
                    {{ product.description }}
                </p>

                <div class="mt-4 space-y-2">

                    <p>
                        <span class="text-red-500">Category:</span>
                        {{ product.category }}
                    </p>

                    <p>
                        <span class="text-red-500">Price:</span>
                        ₹{{ product.price }}
                    </p>

                    <p>
                        <span class="text-red-500">Stock:</span>
                        {{ product.stock }}
                    </p>

                </div>

                <div class="flex gap-4 mt-6">

                    <a href="{% url 'edit_product' product.id %}"
                       class="bg-blue-600 px-5 py-2 rounded-xl hover:bg-blue-700">

                        Edit

                    </a>

                    <a href="{% url 'delete_product' product.id %}"
                       class="bg-red-600 px-5 py-2 rounded-xl hover:bg-red-700">

                        Delete

                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</body>

</html>
