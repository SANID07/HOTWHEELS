<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Admin Home</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-black min-h-screen">

    <!-- Main Container -->

    <div class="max-w-5xl mx-auto mt-16 bg-zinc-900 p-12 rounded-3xl shadow-2xl border border-red-600">

        <!-- Heading -->

        <h1 class="text-5xl font-black text-center text-red-500 tracking-widest">

            HOTWHEELS ADMIN PANEL

        </h1>

        <p class="text-center text-gray-400 mt-5 text-lg">

            Welcome Admin 🚗🔥  
            Manage your HotWheels products and collections here.

        </p>

        <!-- Buttons Section -->

        <div class="grid md:grid-cols-3 gap-8 mt-14">

            <!-- Add Product -->

            <a href="{% url 'add_product' %}"
               class="bg-red-600 hover:bg-red-700 transition duration-300 rounded-2xl p-8 text-center shadow-lg">

                <h2 class="text-3xl font-bold text-white">

                    ➕ Add Product

                </h2>

                <p class="text-gray-200 mt-3">

                    Add new HotWheels collections and products.

                </p>

            </a>

            <!-- Product List -->

            <a href="{% url 'product_list' %}"
               class="bg-blue-600 hover:bg-blue-700 transition duration-300 rounded-2xl p-8 text-center shadow-lg">

                <h2 class="text-3xl font-bold text-white">

                    📦 Product List

                </h2>

                <p class="text-gray-200 mt-3">

                    View, edit and manage all products.

                </p>

            </a>

            <!-- Logout -->

            <a href="{% url 'logout' %}"
               class="bg-zinc-700 hover:bg-zinc-800 transition duration-300 rounded-2xl p-8 text-center shadow-lg">

                <h2 class="text-3xl font-bold text-white">

                    🚪 Logout

                </h2>

                <p class="text-gray-200 mt-3">

                    Securely logout from admin dashboard.

                </p>

            </a>

        </div>

    </div>

</body>

</html>
