<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HotWheels Profile</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>

        body{
            font-family: 'Orbitron', sans-serif;
            background: #000;
            overflow-x: hidden;
        }

        .glow{
            box-shadow: 0px 0px 20px rgba(255,0,0,0.7);
        }

        .card-glow:hover{
            transform: translateY(-5px);
            box-shadow: 0px 0px 30px rgba(255,0,0,0.9);
        }

    </style>

</head>

<body class="min-h-screen text-white">

    <!-- Background -->

    <div class="absolute inset-0">

        <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1883&auto=format&fit=crop"
             class="w-full h-full object-cover opacity-20">

    </div>

    <!-- Main Content -->

    <div class="relative z-10">

        <!-- Navbar -->

        <nav class="bg-black/80 backdrop-blur-md border-b border-red-700 px-8 py-5 flex justify-between items-center">

            <h1 class="text-3xl md:text-4xl font-black text-red-500 tracking-widest">

                HOTWHEELS

            </h1>

            <div class="flex gap-4">

                <a href="{% url 'home' %}"
                   class="bg-zinc-800 hover:bg-red-600 px-5 py-2 rounded-xl transition duration-300">

                    Home

                </a>

                <a href="{% url 'logout' %}"
                   class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-xl transition duration-300">

                    Logout

                </a>

            </div>

        </nav>

        <!-- Profile Section -->

        <div class="max-w-6xl mx-auto px-6 py-14">

            <div class="grid lg:grid-cols-3 gap-10">

                <!-- Left Profile Card -->

                <div class="bg-zinc-900/90 rounded-3xl p-8 glow text-center card-glow transition duration-500">

                    <!-- Profile Image -->

                    <div class="relative w-40 h-40 mx-auto">

                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                             class="w-full h-full rounded-full border-4 border-red-500 object-cover">

                    </div>

                    <!-- Username -->

                    <h2 class="text-3xl font-bold text-red-500 mt-6">

                        {{ user.name }}

                    </h2>

                    <p class="text-gray-400 mt-2">

                        Premium Collector

                    </p>

                    <!-- Stats -->

                    <div class="grid grid-cols-3 gap-4 mt-8">

                        <div class="bg-black rounded-xl p-4">

                            <h3 class="text-red-500 text-2xl font-bold">
                                24
                            </h3>

                            <p class="text-sm text-gray-400">
                                Orders
                            </p>

                        </div>

                        <div class="bg-black rounded-xl p-4">

                            <h3 class="text-red-500 text-2xl font-bold">
                                12
                            </h3>

                            <p class="text-sm text-gray-400">
                                Cars
                            </p>

                        </div>

                        <div class="bg-black rounded-xl p-4">

                            <h3 class="text-red-500 text-2xl font-bold">
                                5
                            </h3>

                            <p class="text-sm text-gray-400">
                                Rewards
                            </p>

                        </div>

                    </div>

                    <!-- Buttons -->

                    <div class="mt-8 flex flex-col gap-4">

                        <button onclick="document.getElementById('editModal').classList.remove('hidden')"
                                class="bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold transition duration-300">

                            Edit Profile

                        </button>

                        <a href="{% url 'logout' %}"
                           class="bg-zinc-800 hover:bg-zinc-700 py-3 rounded-xl font-bold transition duration-300">

                            Logout

                        </a>

                    </div>

                </div>

                <!-- Right Side -->

                <div class="lg:col-span-2 space-y-8">

                    <!-- User Details -->

                    <div class="bg-zinc-900/90 rounded-3xl p-8 glow card-glow transition duration-500">

                        <h2 class="text-3xl font-bold text-red-500 mb-8">

                            Profile Details

                        </h2>

                        <div class="grid md:grid-cols-2 gap-6">

                            <div>

                                <label class="text-gray-400">
                                    Full Name
                                </label>

                                <div class="mt-2 bg-black p-4 rounded-xl">

                                    {{ user.name }}

                                </div>

                            </div>

                            <div>

                                <label class="text-gray-400">
                                    Email Address
                                </label>

                                <div class="mt-2 bg-black p-4 rounded-xl">

                                    {{ user.email }}

                                </div>

                            </div>

                            <div>

                                <label class="text-gray-400">
                                    Phone Number
                                </label>

                                <div class="mt-2 bg-black p-4 rounded-xl">

                                    {{ user.phone }}

                                </div>

                            </div>

                            <div>

                                <label class="text-gray-400">
                                    Membership
                                </label>

                                <div class="mt-2 bg-black p-4 rounded-xl">

                                    Elite Collector
                                </div>

                            </div>

                        </div>

                        <div class="mt-6">

                            <label class="text-gray-400">
                                Address
                            </label>

                            <div class="mt-2 bg-black p-4 rounded-xl">

                                {{ user.address }}

                            </div>

                        </div>

                    </div>

                    <!-- Favorite Cars -->

                    <div class="bg-zinc-900/90 rounded-3xl p-8 glow card-glow transition duration-500">

                        <h2 class="text-3xl font-bold text-red-500 mb-8">

                            Favorite Collections

                        </h2>

                        <div class="grid md:grid-cols-3 gap-6">

                            <div class="bg-black rounded-2xl overflow-hidden">

                                <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop"
                                     class="h-40 w-full object-cover">

                                <div class="p-4">

                                    <h3 class="text-xl font-bold text-red-500">
                                        Mustang GT
                                    </h3>

                                </div>

                            </div>

                            <div class="bg-black rounded-2xl overflow-hidden">

                                <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?q=80&w=1938&auto=format&fit=crop"
                                     class="h-40 w-full object-cover">

                                <div class="p-4">

                                    <h3 class="text-xl font-bold text-red-500">
                                        Ferrari X
                                    </h3>

                                </div>

                            </div>

                            <div class="bg-black rounded-2xl overflow-hidden">

                                <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?q=80&w=2072&auto=format&fit=crop"
                                     class="h-40 w-full object-cover">

                                <div class="p-4">

                                    <h3 class="text-xl font-bold text-red-500">
                                        Aventador
                                    </h3>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Edit Profile Modal -->

    <div id="editModal"
         class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">

        <div class="bg-zinc-900 rounded-3xl p-10 w-full max-w-2xl relative glow">

            <!-- Close Button -->

            <button onclick="document.getElementById('editModal').classList.add('hidden')"
                    class="absolute top-5 right-5 text-red-500 text-3xl">

                ×

            </button>

            <h2 class="text-4xl font-bold text-red-500 mb-8 text-center">

                Edit Profile

            </h2>

            <form method="POST">

                {% csrf_token %}

                <div class="grid md:grid-cols-2 gap-6">

                    <!-- Name -->

                    <div>

                        <label class="text-gray-300">
                            Full Name
                        </label>

                        <input type="text"
                               name="name"
                               value="{{ user.name }}"

                               class="w-full mt-2 p-4 rounded-xl bg-black border border-zinc-700 focus:ring-2 focus:ring-red-500 outline-none">

                    </div>

                    <!-- Email -->

                    <div>

                        <label class="text-gray-300">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               value="{{ user.email }}"

                               class="w-full mt-2 p-4 rounded-xl bg-black border border-zinc-700 focus:ring-2 focus:ring-red-500 outline-none">

                    </div>

                    <!-- Phone -->

                    <div>

                        <label class="text-gray-300">
                            Phone
                        </label>

                        <input type="text"
                               name="phone"
                               value="{{ user.phone }}"

                               class="w-full mt-2 p-4 rounded-xl bg-black border border-zinc-700 focus:ring-2 focus:ring-red-500 outline-none">

                    </div>

                    <!-- Password -->

                    <div>

                        <label class="text-gray-300">
                            Password
                        </label>

                        <input type="password"
                               name="password"

                               class="w-full mt-2 p-4 rounded-xl bg-black border border-zinc-700 focus:ring-2 focus:ring-red-500 outline-none">

                    </div>

                </div>

                <!-- Address -->

                <div class="mt-6">

                    <label class="text-gray-300">
                        Address
                    </label>

                    <textarea name="address"
                              rows="4"

                              class="w-full mt-2 p-4 rounded-xl bg-black border border-zinc-700 focus:ring-2 focus:ring-red-500 outline-none">{{ user.address }}</textarea>

                </div>

                <!-- Save Button -->

                <button type="submit"
                        class="w-full mt-8 bg-red-600 hover:bg-red-700 py-4 rounded-xl text-lg font-bold transition duration-300">

                    Save Changes

                </button>

            </form>

        </div>

    </div>

</body>

</html>
