<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="max-w-7xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold mb-8 text-center">Our Products</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            
            {% for product in products %}
            <div class="bg-white rounded-2xl shadow-md hover:shadow-xl transition duration-300 overflow-hidden">

                <!-- Product Image -->
                <img src="{{ product.image.url }}" alt="{{ product.name }}"
                     class="w-full h-48 object-cover">

                     <br><br>

<button class="cart-btn">Add to Cart</button>

<a href="/wishlist/">
<button class="wish-btn">Wishlist</button>
</a>

                <!-- Product Info -->
                <div class="p-4">
                    <h2 class="text-lg font-semibold text-gray-800">
                        {{ product.name }}
                    </h2>

                    <p class="text-sm text-gray-500 mt-1 line-clamp-2">
                        {{ product.description }}
                    </p>

                    <div class="mt-3 flex items-center justify-between">
                        <span class="text-xl font-bold text-green-600">
                            ₹{{ product.price }}
                        </span>
                        <span class="text-sm text-gray-400">
                            {{ product.category }}
                        </span>
                    </div>

                    <!-- Buttons -->
                    <div class="mt-4 flex gap-2">

                        <!-- Add to Cart -->
                        <form method="POST" action="{% url 'add_to_cart' product.id %}">
                            {% csrf_token %}
                            <button type="submit"
                                class="flex-1 bg-blue-600 text-white px-3 py-2 rounded-lg text-sm hover:bg-blue-700 transition">
                                🛒 Cart
                            </button>
                        </form>

                        <!-- Wishlist -->
                        <form method="POST" action="{% url 'add_to_wishlist' product.id %}">
                            {% csrf_token %}
                            <button type="submit"
                                class="flex-1 bg-pink-500 text-white px-3 py-2 rounded-lg text-sm hover:bg-pink-600 transition">
                                ❤️ Wishlist
                            </button>
                        </form>

                    </div>

                </div>
            </div>
            {% endfor %}

        </div>
    </div>

</body>
</html>
